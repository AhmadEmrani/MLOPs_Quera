# PromiseOps G02
# All CI jobs are loaded from local YAML files.

stages: [test, build, deploy_staging, model_release, model_image, deploy_model_staging, deploy_prod, sync, inspect]
variables:
  RUN_MODEL_RELEASE: "false"
  UV_OFFLINE: "1"
  UV_PYTHON_DOWNLOADS: never
  PIP_NO_INDEX: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_LINK_MODE: copy
  HOME: /tmp/home
  UV_CACHE_DIR: /tmp/uv-cache
  FF_USE_ADVANCED_POD_SPEC_CONFIGURATION: "true"

default:
  image: $CI_TOOLBOX_IMAGE
  tags: [promiseops]
  before_script:
    - mkdir -p "$HOME"

include:
  - local: "/.gitlab/ci/test.yml"
  - local: "/.gitlab/ci/build.yml"
  - local: "/.gitlab/ci/airflow.yml"
  - local: "/.gitlab/ci/inspect.yml"
  - local: "/.gitlab/ci/release.yml"
