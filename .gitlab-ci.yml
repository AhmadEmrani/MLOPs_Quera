# PromiseOps G02
# All CI jobs are loaded from local YAML files.

stages:
  [
    test,
    build,
    deploy_staging,
    model_release,
    model_image,
    deploy_model_staging,
    deploy_prod,
    sync,
    inspect,
  ]
variables:
  RUN_MODEL_RELEASE: "false"
  PROMISEOPS_RUNTIME_SERVICE_ACCOUNT: "default"
  PROMISEOPS_SMOKE_ORDER_ID: "1ff217aa612f6cd7c4255c9bfe931c8b"
  UV_OFFLINE: "1"
  UV_PYTHON_DOWNLOADS: never
  PIP_NO_INDEX: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_LINK_MODE: copy
  HOME: /tmp/home
  UV_CACHE_DIR: /tmp/uv-cache
  FF_USE_ADVANCED_POD_SPEC_CONFIGURATION: "true"

default:
  image: $CI_TOOLBOX_IMAGE
  tags: [promiseops]
  before_script:
    - mkdir -p "$HOME"

include:
  - local: "/.gitlab/ci/test.yml"
  - local: "/.gitlab/ci/helm.yml"
  - local: "/.gitlab/ci/staging-check.yml"
  - local: "/.gitlab/ci/build.yml"
  - local: "/.gitlab/ci/airflow.yml"
  - local: "/.gitlab/ci/inspect.yml"
  - local: "/.gitlab/ci/release.yml"
  - local: "/.gitlab/ci/inspect-deploy-failure.yml"
  - local: "/.gitlab/ci/load.yml"
