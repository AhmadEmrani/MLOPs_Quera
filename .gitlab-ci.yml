# PromiseOps G02
# All CI jobs are loaded from local YAML files.

stages: [test, build, sync, inspect, deploy]

variables:
  UV_OFFLINE: "1"
  UV_PYTHON_DOWNLOADS: never
  PIP_NO_INDEX: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  UV_LINK_MODE: copy
  HOME: /tmp/home
  UV_CACHE_DIR: /tmp/uv-cache
  FF_USE_ADVANCED_POD_SPEC_CONFIGURATION: "true"

default:
  image: $CI_TOOLBOX_IMAGE
  tags: [promiseops]
  before_script:
    - mkdir -p "$HOME"

include:
  - local: "/.gitlab/ci/test.yml"
  - local: "/.gitlab/ci/helm.yml"
  - local: "/.gitlab/ci/staging-check.yml"
  - local: "/.gitlab/ci/build.yml"
  - local: "/.gitlab/ci/airflow.yml"
  - local: "/.gitlab/ci/inspect.yml"
  - local: "/.gitlab/ci/deploy.yml"

