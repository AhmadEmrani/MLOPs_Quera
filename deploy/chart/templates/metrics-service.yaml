# Headless Service for Prometheus pod-level scraping.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "promiseops.fullname" . }}-metrics
  labels:
    {{- include "promiseops.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    {{- include "promiseops.selectorLabels" . | nindent 4 }}
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http
      protocol: TCP
