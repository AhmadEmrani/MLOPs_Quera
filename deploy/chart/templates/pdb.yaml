{{- if and .Values.pdb.enabled (gt (int .Values.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "promiseops.fullname" . }}
  labels:
    {{- include "promiseops.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "promiseops.selectorLabels" . | nindent 6 }}
{{- end }}
