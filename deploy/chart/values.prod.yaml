# Production – namespace budget: 3 CPU / 3 GiB.
# Three API replicas plus one scoring Job fit exactly; production CI suspends
# the CronJob and waits for active scoring before a rollout adds its surge Pod.

replicaCount: 2

# image.digest must be injected by CI: helm upgrade ... --set image.digest=sha256:<real>
# Do not commit a digest here; keep it empty to force CI to supply it.

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 750m
    memory: 768Mi

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# 3 API replicas at 750m/768Mi plus one scoring Job at 750m/768Mi fit
# exactly within the 3 CPU / 3 GiB quota. CI waits for scoring to finish
# before beginning a rolling update, whose surge pod needs the same budget.
batchJob:
  enabled: true
