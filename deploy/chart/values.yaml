# Base defaults – override per environment with values.staging.yaml / values.prod.yaml

replicaCount: 1

image:
  repository: registry.mlops.qbootcamp.ir/qbc13/g02/promiseops/app
  # Empty string forces the required() check in promiseops.image helper to fail fast.
  # CI must supply the real digest with: --set image.digest=sha256:<64hex>
  digest: ""

# Name of the ServiceAccount pre-created by platform staff. Do not create it here.
serviceAccount:
  name: promiseops-api

# Create a headless metrics Service by default; production reuses the existing platform Service.
metricsService:
  create: true

# Name of the registry pull secret pre-created by platform staff.
imagePullSecrets:
  - name: registry-pull

service:
  # ClusterIP is hardcoded in api-service.yaml; this only controls the port.
  port: 80
  # containerPort is fixed at 8080 (Dockerfile / Uvicorn).

# Production worst case is three API replicas plus one scoring job (3 CPU / 3 GiB).
# CI waits for scoring to finish before a rollout adds its surge replica.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 750m
    memory: 768Mi

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 3
  readiness:
    # Returns 503 when model bundle or DB is unavailable.
    path: /readyz
    initialDelaySeconds: 15
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 3

lifecycle:
  # Drain in-flight requests before the container is stopped.
  preStopSleepSeconds: 10

terminationGracePeriodSeconds: 45

runtimeConfig:
  # Name of the runtime-config Secret pre-created by platform staff.
  secretName: runtime-config

hpa:
  enabled: false
  # minReplicas is only meaningful in prod (values.prod.yaml); kept here as a safe default.
  minReplicas: 2
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

batchJob:
  enabled: false
  suspend: false
  schedule: "0 2 * * *"
  activeDeadlineSeconds: 3600
  backoffLimit: 2
  # Kubernetes command overrides the API image ENTRYPOINT for the scoring process.
  command: ["/opt/venv/bin/python", "-m", "promiseops.scheduled_batch"]
  args: []
  lookbackHours: 24
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 750m
      memory: 768Mi
