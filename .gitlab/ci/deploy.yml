# Manual staging deploy. Runs only on main (protected: KUBECONFIG).
# Deploys only to $TEAM-staging. No prod, rollback, or uninstall here.
deploy-staging:
  stage: deploy
  needs: [build-own-image]
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
    - when: never
  script:
    - set -eu
    - DIGEST="$(python -c 'import json; print(json.load(open("build.json"))["containerimage.digest"])')"
    - echo "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
    - helm upgrade --install promiseops deploy/chart -n "$TEAM-staging" -f deploy/chart/values.staging.yaml --set image.repository="$CI_REGISTRY_IMAGE/app" --set image.digest="$DIGEST" --wait --timeout 5m
    - helm -n "$TEAM-staging" status promiseops
