# Monitoring stage 1: pure contract tests, no DB/MLflow/Production writes.
monitoring-contracts:
  stage: test
  needs: []
  script:
    - cp -a /opt/promiseops/wheelhouse ./wheelhouse
    - uv venv --python /usr/local/bin/python .monitor-tests-venv
    - uv pip sync --python .monitor-tests-venv/bin/python --no-index --find-links wheelhouse --require-hashes requirements.lock
    - PYTHONPATH=src .monitor-tests-venv/bin/python -m pytest -q tests/test_monitoring_phase1.py

# Optional manual live *read-only* preview. Requires approved 004 schema migration,
# baseline artifact from an exact MLflow run, and a company-time cutoff.
inspect-monitoring-preview:
  stage: inspect
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - |
      set -eu
      set +x
      umask 077
      : "${MONITOR_AS_OF:?Set approved company-time cutoff}"
      : "${MONITOR_MODEL_VERSION:?Set immutable sha256:model identity}"
      : "${MONITOR_RUN_ID:?Set exact MLflow training Run ID}"
      : "${MONITOR_FEATURE_REFERENCE_SHA256:?Set verified SHA256 of feature_reference.json}"
      . ci/require_mlflow_ci_env.sh
      PRIVATE_DIR="$(mktemp -d)"
      trap 'rm -rf "$PRIVATE_DIR"' EXIT HUP INT TERM
      cp -a /opt/promiseops/tracking-wheelhouse ./tracking-wheelhouse
      uv venv --python /usr/local/bin/python .tracking-venv
      uv pip sync --python .tracking-venv/bin/python --no-index --find-links tracking-wheelhouse --require-hashes requirements-tracking.lock
      PYTHONPATH=src .tracking-venv/bin/python ci/download_monitoring_reference.py \
        --run-id "$MONITOR_RUN_ID" \
        --model-version "$MONITOR_MODEL_VERSION" \
        --reference-sha256 "$MONITOR_FEATURE_REFERENCE_SHA256" \
        --destination "$PRIVATE_DIR"
      PG_B64="$(kubectl get secret runtime-config -n g02-prod -o jsonpath='{.data.PROMISEOPS_DATABASE_URL}')"
      test -n "$PG_B64"
      PROMISEOPS_DATABASE_URL="$(printf '%s' "$PG_B64" | base64 -d)"
      unset PG_B64
      export PROMISEOPS_DATABASE_URL
      cp -a /opt/promiseops/wheelhouse ./wheelhouse
      uv venv --python /usr/local/bin/python .monitor-venv
      uv pip sync --python .monitor-venv/bin/python --no-index --find-links wheelhouse --require-hashes requirements.lock
      PYTHONPATH=src .monitor-venv/bin/python -m promiseops.monitoring.cli \
        --as-of "$MONITOR_AS_OF" \
        --model-version "$MONITOR_MODEL_VERSION" \
        --reference-file "$PRIVATE_DIR/feature_reference.json" \
        --validation-metrics "$PRIVATE_DIR/validation_metrics.json" \
        --reference-sha256 "$MONITOR_FEATURE_REFERENCE_SHA256" \
        --output reports/monitoring/preview.json
      unset PROMISEOPS_DATABASE_URL
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/monitoring/preview.json

# Manual, authorized read-only SQL probe. No schema changes, no row data exports.
inspect-monitoring-db-readonly:
  stage: inspect
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - |
      set -eu
      set +x
      umask 077
      : "${MONITOR_AS_OF:?Set the authorized historical company-time cutoff}"
      kubectl auth can-i get secret/runtime-config -n g02-prod --quiet
      PG_B64="$(kubectl get secret runtime-config -n g02-prod -o jsonpath='{.data.PROMISEOPS_DATABASE_URL}')"
      test -n "$PG_B64"
      PROMISEOPS_DATABASE_URL="$(printf '%s' "$PG_B64" | base64 -d)"
      unset PG_B64
      export PROMISEOPS_DATABASE_URL
      cp -a /opt/promiseops/wheelhouse ./wheelhouse
      uv venv --python /usr/local/bin/python .monitor-db-inspect-venv
      uv pip sync --python .monitor-db-inspect-venv/bin/python --no-index --find-links wheelhouse --require-hashes requirements.lock
      PYTHONPATH=src .monitor-db-inspect-venv/bin/python ci/inspect_monitoring_db.py \
        --as-of "$MONITOR_AS_OF" --output reports/monitoring/db-readiness.json
      unset PROMISEOPS_DATABASE_URL
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/monitoring/db-readiness.json
