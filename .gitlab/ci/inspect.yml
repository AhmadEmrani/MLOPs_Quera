inspect-own-namespaces:
  needs: []
  stage: inspect
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - for area in staging prod; do kubectl get pods,deployments,jobs -n "$TEAM-$area"; done
    - kubectl get pods,jobs -n "$TEAM-jobs"

# Read-only discovery for using the deployed API. Prints cluster resource
# metadata and ingress hosts only; it never reads Secret data or pod env values.
inspect-api-endpoint:
  stage: inspect
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - |
      set -u
      : "${TEAM:=g02}"
      REPORT="api-usage-${TEAM}.txt"
      {
        echo "PromiseOps API discovery (team=${TEAM}; commit=${CI_COMMIT_SHA:-unknown})"
        echo "No Secret values are read or printed by this job."
        for area in staging prod; do
          namespace="${TEAM}-${area}"
          echo
          echo "=== ${area}: Services (the API should have a ClusterIP Service) ==="
          kubectl get services -n "$namespace" -o wide \
            || echo "Cannot list Services in ${namespace}"
          echo "=== ${area}: Service endpoints ==="
          kubectl get endpoints -n "$namespace" -o wide \
            || echo "Cannot list Endpoints in ${namespace}; ask staff whether read access can be granted"
          echo "=== ${area}: Deployments ==="
          kubectl get deployments -n "$namespace" -o wide \
            || echo "Cannot list Deployments in ${namespace}"
          echo "=== ${area}: Pods ==="
          kubectl get pods -n "$namespace" -o wide \
            || echo "Cannot list Pods in ${namespace}"
          echo "=== ${area}: HPA ==="
          kubectl get hpa -n "$namespace" -o wide \
            || echo "Cannot list HPA in ${namespace}"
          echo "=== ${area}: CronJobs ==="
          kubectl get cronjobs -n "$namespace" -o wide \
            || echo "Cannot list CronJobs in ${namespace}"
          echo "=== ${area}: deployed image references ==="
          kubectl get deployments -n "$namespace" \
            -o custom-columns='DEPLOYMENT:.metadata.name,IMAGES:.spec.template.spec.containers[*].image' \
            || echo "Cannot list deployment image references in ${namespace}"
          echo "=== ${area}: ingress host and path ==="
          kubectl get ingress -n "$namespace" \
            -o custom-columns='NAME:.metadata.name,HOSTS:.spec.rules[*].host,PATHS:.spec.rules[*].http.paths[*].path' \
            || echo "No ingress visible in ${namespace} (it may be provisioned elsewhere)"
          echo "=== ${area}: runtime Secret names and key names only ==="
          kubectl get secret -n "$namespace" \
            -o go-template='{{range .items}}{{.metadata.name}}{{" keys="}}{{range $key, $_ := .data}}{{$key}} {{end}}{{"\n"}}{{end}}' \
            || echo "Cannot list Secret metadata in ${namespace}"
          echo "=== ${area}: pre-created service accounts ==="
          kubectl get serviceaccounts -n "$namespace" \
            -o custom-columns='NAME:.metadata.name,IMAGE-PULL-SECRETS:.imagePullSecrets[*].name' \
            || echo "Cannot list service accounts in ${namespace}"
          echo "=== ${area}: selected resource permissions ==="
          for resource in services endpoints deployments pods hpa cronjobs jobs secrets serviceaccounts; do
            printf '%s: ' "$resource"
            kubectl auth can-i get "$resource" -n "$namespace" || true
          done
          echo "=== ${area}: deployment permissions needed by the pipeline ==="
          printf 'list jobs: '
          kubectl auth can-i list jobs -n "$namespace" || true
          for resource in cronjobs deployments services horizontalpodautoscalers; do
            for verb in get list create update patch; do
              printf '%s %s: ' "$verb" "$resource"
              kubectl auth can-i "$verb" "$resource" -n "$namespace" || true
            done
          done
          for verb in get list create update delete; do
            printf '%s secrets (Helm release storage): ' "$verb"
            kubectl auth can-i "$verb" secrets -n "$namespace" || true
          done
        done
        echo
        echo "=== API contract ==="
        echo "POST /predict; header: X-API-Key; JSON: {\"order_id\":\"<known-order-id>\",\"request_id\":\"optional-id\"}"
        echo "GET /healthz and GET /readyz need no API key; /metrics requires X-API-Key."
        echo "Success response contains risk_probability, model_version, request_id."
        echo "In-cluster URL pattern: http://<service-name>.${TEAM}-<area>.svc:80 (use the service name listed above)."
        echo "Use the ingress HOST above, or port-forward the discovered ClusterIP Service from an authorized kubectl context."
        echo "The actual API key is deliberately not retrieved. Obtain it through the approved secret delivery process."
      } | tee "$REPORT"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - api-usage-*.txt

inspect-ci-config-presence:
  stage: inspect
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - python ci/inspect_ci_config.py

inspect-training-failure:
  stage: inspect
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - |
      set -eu

      NAMESPACE="g02-jobs"
      JOB_NAME="${TRAIN_JOB_NAME:?Set TRAIN_JOB_NAME when running this job}"

      echo "=== SELECTED TRAINING JOB: $JOB_NAME ==="

      echo "=== TRAINING JOB ==="
      kubectl get job "$JOB_NAME" \
        -n "$NAMESPACE"

      echo "=== JOB CONDITIONS ==="
      kubectl get job "$JOB_NAME" \
        -n "$NAMESPACE" \
        -o jsonpath='{range .status.conditions[*]}type={.type} reason={.reason} message={.message}{"\n"}{end}'

      echo "=== JOB PODS ==="
      kubectl get pods -n "$NAMESPACE" \
        -l "batch.kubernetes.io/job-name=$JOB_NAME"

      echo "=== LOG ACCESS ==="
      kubectl auth can-i get pods/log \
        -n "$NAMESPACE"

      echo "=== CONTAINER EXIT STATUS AND LOGS ==="

      PODS="$(kubectl get pods \
        -n "$NAMESPACE" \
        -l "batch.kubernetes.io/job-name=$JOB_NAME" \
        -o jsonpath='{.items[*].metadata.name}')"

      if [ -z "$PODS" ]; then
        echo "No pods found for job: $JOB_NAME"
        exit 0
      fi

      for POD in $PODS; do
        echo "=== POD: $POD ==="

        kubectl get pod "$POD" \
          -n "$NAMESPACE" \
          -o jsonpath='{range .status.containerStatuses[*]}container={.name} exit={.state.terminated.exitCode} reason={.state.terminated.reason}{"\n"}{end}'

        echo ""
        echo "=== LAST 120 LOG LINES ==="

        kubectl logs "$POD" \
          -n "$NAMESPACE" \
          --all-containers=true \
          --tail=120 \
          --timestamps || true
      done
