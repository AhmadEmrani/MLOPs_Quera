inspect-own-namespaces:
  needs: []
  stage: inspect
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - for area in staging prod; do kubectl get pods,deployments,jobs -n "$TEAM-$area"; done
    - kubectl get pods,jobs -n "$TEAM-jobs"

# Read-only discovery for using the deployed API. Prints cluster resource
# metadata and ingress hosts only; it never reads Secret data or pod env values.
inspect-api-endpoint:
  stage: inspect
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - |
      set -u
      : "${TEAM:=g02}"
      REPORT="api-usage-${TEAM}.txt"
      {
        echo "PromiseOps API discovery (team=${TEAM}; commit=${CI_COMMIT_SHA:-unknown})"
        echo "No Secret values are read or printed by this job."
        for area in staging prod; do
          namespace="${TEAM}-${area}"
          echo
          echo "=== ${area}: Services (the API should have a ClusterIP Service) ==="
          kubectl get services -n "$namespace" -o wide \
            || echo "Cannot list Services in ${namespace}"
          echo "=== ${area}: Service endpoints ==="
          kubectl get endpoints -n "$namespace" -o wide \
            || echo "Cannot list Endpoints in ${namespace}; ask staff whether read access can be granted"
          echo "=== ${area}: Deployments ==="
          kubectl get deployments -n "$namespace" -o wide \
            || echo "Cannot list Deployments in ${namespace}"
          echo "=== ${area}: Pods ==="
          kubectl get pods -n "$namespace" -o wide \
            || echo "Cannot list Pods in ${namespace}"
          echo "=== ${area}: HPA ==="
          kubectl get hpa -n "$namespace" -o wide \
            || echo "Cannot list HPA in ${namespace}"
          echo "=== ${area}: CronJobs ==="
          kubectl get cronjobs -n "$namespace" -o wide \
            || echo "Cannot list CronJobs in ${namespace}"
          echo "=== ${area}: deployed image references ==="
          kubectl get deployments -n "$namespace" \
            -o custom-columns='DEPLOYMENT:.metadata.name,IMAGES:.spec.template.spec.containers[*].image' \
            || echo "Cannot list deployment image references in ${namespace}"
          echo "=== ${area}: ingress host and path ==="
          kubectl get ingress -n "$namespace" \
            -o custom-columns='NAME:.metadata.name,HOSTS:.spec.rules[*].host,PATHS:.spec.rules[*].http.paths[*].path' \
            || echo "No ingress visible in ${namespace} (it may be provisioned elsewhere)"
          echo "=== ${area}: runtime Secret names and key names only ==="
          kubectl get secret -n "$namespace" \
            -o go-template='{{range .items}}{{.metadata.name}}{{" keys="}}{{range $key, $_ := .data}}{{$key}} {{end}}{{"\n"}}{{end}}' \
            || echo "Cannot list Secret metadata in ${namespace}"
          echo "=== ${area}: pre-created service accounts ==="
          kubectl get serviceaccounts -n "$namespace" \
            -o custom-columns='NAME:.metadata.name,IMAGE-PULL-SECRETS:.imagePullSecrets[*].name' \
            || echo "Cannot list service accounts in ${namespace}"
          echo "=== ${area}: selected resource permissions ==="
          for resource in services endpoints deployments pods hpa cronjobs jobs secrets serviceaccounts; do
            printf '%s: ' "$resource"
            kubectl auth can-i get "$resource" -n "$namespace" || true
          done
          echo "=== ${area}: deployment permissions needed by the pipeline ==="
          printf 'list jobs: '
          kubectl auth can-i list jobs -n "$namespace" || true
          for resource in cronjobs deployments services horizontalpodautoscalers; do
            for verb in get list create update patch; do
              printf '%s %s: ' "$verb" "$resource"
              kubectl auth can-i "$verb" "$resource" -n "$namespace" || true
            done
          done
          for verb in get list create update delete; do
            printf '%s secrets (Helm release storage): ' "$verb"
            kubectl auth can-i "$verb" secrets -n "$namespace" || true
          done
        done
        echo
        echo "=== API contract ==="
        echo "POST /predict; header: X-API-Key; JSON: {\"order_id\":\"<known-order-id>\",\"request_id\":\"optional-id\"}"
        echo "GET /healthz and GET /readyz need no API key; /metrics requires X-API-Key."
        echo "Success response contains risk_probability, model_version, request_id."
        echo "In-cluster URL pattern: http://<service-name>.${TEAM}-<area>.svc:80 (use the service name listed above)."
        echo "Use the ingress HOST above, or port-forward the discovered ClusterIP Service from an authorized kubectl context."
        echo "The actual API key is deliberately not retrieved. Obtain it through the approved secret delivery process."
      } | tee "$REPORT"
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - api-usage-*.txt

inspect-ci-config-presence:
  stage: inspect
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - python ci/inspect_ci_config.py

inspect-training-failure:
  stage: inspect
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - |
      set -eu

      NAMESPACE="g02-jobs"
      JOB_NAME="${TRAIN_JOB_NAME:?Set TRAIN_JOB_NAME when running this job}"

      echo "=== SELECTED TRAINING JOB: $JOB_NAME ==="

      echo "=== TRAINING JOB ==="
      kubectl get job "$JOB_NAME" \
        -n "$NAMESPACE"

      echo "=== JOB CONDITIONS ==="
      kubectl get job "$JOB_NAME" \
        -n "$NAMESPACE" \
        -o jsonpath='{range .status.conditions[*]}type={.type} reason={.reason} message={.message}{"\n"}{end}'

      echo "=== JOB PODS ==="
      kubectl get pods -n "$NAMESPACE" \
        -l "batch.kubernetes.io/job-name=$JOB_NAME"

      echo "=== LOG ACCESS ==="
      kubectl auth can-i get pods/log \
        -n "$NAMESPACE"

      echo "=== CONTAINER EXIT STATUS AND LOGS ==="

      PODS="$(kubectl get pods \
        -n "$NAMESPACE" \
        -l "batch.kubernetes.io/job-name=$JOB_NAME" \
        -o jsonpath='{.items[*].metadata.name}')"

      if [ -z "$PODS" ]; then
        echo "No pods found for job: $JOB_NAME"
        exit 0
      fi

      for POD in $PODS; do
        echo "=== POD: $POD ==="

        kubectl get pod "$POD" \
          -n "$NAMESPACE" \
          -o jsonpath='{range .status.containerStatuses[*]}container={.name} exit={.state.terminated.exitCode} reason={.state.terminated.reason}{"\n"}{end}'

        echo ""
        echo "=== LAST 120 LOG LINES ==="

        kubectl logs "$POD" \
          -n "$NAMESPACE" \
          --all-containers=true \
          --tail=120 \
          --timestamps || true
      done

# Read-only inspection of production resource capacity.
inspect-prod-resources:
  stage: inspect
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - |
      set -u

      NAMESPACE="${TEAM:-g02}-prod"

      echo "=================================="
      echo "Production Resource Inspection"
      echo "Namespace: $NAMESPACE"
      echo "=================================="

      echo ""
      echo "=== ResourceQuota permissions ==="
      kubectl auth can-i list resourcequotas -n "$NAMESPACE" || true

      echo ""
      echo "=== ResourceQuota ==="
      if kubectl auth can-i list resourcequotas -n "$NAMESPACE" --quiet; then
        kubectl get resourcequotas -n "$NAMESPACE" || true
        kubectl describe resourcequotas -n "$NAMESPACE" || true
      else
        echo "Access denied: cannot list ResourceQuotas."
      fi

      echo ""
      echo "=== LimitRange ==="
      if kubectl auth can-i list limitranges -n "$NAMESPACE" --quiet; then
        kubectl get limitranges -n "$NAMESPACE" || true
        kubectl describe limitranges -n "$NAMESPACE" || true
      else
        echo "Access denied: cannot list LimitRanges."
      fi

      echo ""
      echo "=== HPA ==="
      kubectl get hpa -n "$NAMESPACE" -o wide || true

      echo ""
      echo "=== Deployment ==="
      kubectl get deployments -n "$NAMESPACE" -o wide || true

      echo ""
      echo "=== Pods ==="
      kubectl get pods -n "$NAMESPACE" -o wide || true

      echo ""
      echo "Inspection completed. No resources changed."

      echo "=== HPA DETAILS AND SCALE HISTORY ==="
      kubectl describe hpa promiseops -n "$NAMESPACE" || true

      echo "=== LAST SCALE TIME ==="
      kubectl get hpa promiseops -n "$NAMESPACE" \
        -o jsonpath='{.status.lastScaleTime}{"\n"}' || true

      echo "=== HPA EVENTS ==="
      kubectl get events -n "$NAMESPACE" \
        --field-selector involvedObject.kind=HorizontalPodAutoscaler,involvedObject.name=promiseops \
        --sort-by=.lastTimestamp || true

# Read-only GitLab Runner diagnostic; does not access Production or mutate MLflow.
inspect-mlflow-ci-access:
  stage: inspect
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - |
      set -eu
      set +x
      mkdir -p reports/mlflow
      python ci/inspect_mlflow_ci_access.py --phase preflight --report reports/mlflow/ci-access.json
      test -d /opt/promiseops/tracking-wheelhouse
      cp -a /opt/promiseops/tracking-wheelhouse ./tracking-wheelhouse
      uv venv --python /usr/local/bin/python .mlflow-inspect-venv
      uv pip sync --python .mlflow-inspect-venv/bin/python --no-index --find-links tracking-wheelhouse --require-hashes requirements-tracking.lock
      .mlflow-inspect-venv/bin/python ci/inspect_mlflow_ci_access.py --phase read --report reports/mlflow/ci-access.json
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/mlflow/ci-access.json

inspect-mlflow-direct:
  stage: inspect
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - |
      python - <<'PY'
      import json
      from urllib.request import urlopen
      from urllib.error import HTTPError

      url = (
          "https://g02-mlflow.mlops.qbootcamp.ir"
          "/api/2.0/mlflow/experiments/get?experiment_id=2"
      )

      try:
          with urlopen(url, timeout=10) as response:
              payload = json.load(response)
              experiment = payload.get("experiment", {})
              if str(experiment.get("experiment_id")) != "2":
                  raise ValueError("Unexpected API response")

          print("MLFLOW_READ_API: PASSED")

      except HTTPError as error:
          print(f"MLFLOW_READ_API: HTTP {error.code}")
          raise SystemExit(1)

      except Exception as error:
          print(
              "MLFLOW_READ_API: FAILED "
              + type(error).__name__
          )
          raise SystemExit(1)
      PY

inspect-mlflow-k8s-discovery:
  stage: inspect
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - |
      set -eu

      for ns in g02-ci g02-platform g02-staging g02-prod g02-jobs; do
        echo "=== Namespace: $ns ==="

        if kubectl auth can-i list services -n "$ns" --quiet; then
          kubectl get services -n "$ns" \
            -o custom-columns='NAME:.metadata.name,TYPE:.spec.type' \
            || true
        else
          echo "Services: permission unavailable"
        fi

        if kubectl auth can-i list ingress -n "$ns" --quiet; then
          kubectl get ingress -n "$ns" \
            -o custom-columns='NAME:.metadata.name,CLASS:.spec.ingressClassName' \
            || true
        else
          echo "Ingress: permission unavailable"
        fi
      done

      echo "=== Production runtime-config key names ==="
      if kubectl auth can-i get secret/runtime-config \
          -n g02-prod --quiet; then
        kubectl get secret runtime-config -n g02-prod \
          -o go-template='{{range $key, $_ := .data}}{{$key}}{{"\n"}}{{end}}'
      else
        echo "Secret metadata: permission unavailable"
      fi
