# Optional, manual, read-only feature persistence inspection.
# It never runs automatically on a branch merge or as part of deployment.
inspect-feature-lineage:
  stage: inspect
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  variables:
    PROMISEOPS_FEATURE_INSPECT_HOURS: "24"
  script:
    - set -eu
    - cp -a /opt/promiseops/wheelhouse ./wheelhouse
    - uv venv --python /usr/local/bin/python .load-venv
    - uv pip sync --python .load-venv/bin/python --no-index --find-links wheelhouse --require-hashes requirements.lock
    - sh ci/run_feature_lineage_inspect.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/feature-lineage.json
