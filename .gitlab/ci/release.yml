prepare-model-release:
  stage: model_release
  needs:
    - job: verify-staging-api
      artifacts: false
  resource_group: promiseops-model-release
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RUN_MODEL_RELEASE == "true"'
      when: manual
  allow_failure: true
  script:
    - |
      set -eu
      set +x
      test -d /opt/promiseops/tracking-wheelhouse
      cp -a /opt/promiseops/tracking-wheelhouse ./tracking-wheelhouse
      uv venv --python /usr/local/bin/python .release-venv
      uv pip sync --python .release-venv/bin/python --no-index \
        --find-links tracking-wheelhouse --require-hashes requirements-tracking.lock
      . ci/require_mlflow_ci_env.sh
      .release-venv/bin/python ci/prepare_model_release.py --destination dist/model-release
      set -a
      . dist/model-release/release.env
      set +a
      case "$MODEL_PACKAGE_VERSION" in *[!A-Za-z0-9._-]*|'') echo "Invalid model package version" >&2; exit 1 ;; esac
      PACKAGE_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/promiseops-release/$MODEL_PACKAGE_VERSION"
      for file in model.joblib release.json feature_contract.json dataset_manifest.json selection.json; do
        curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "dist/model-release/$file" "$PACKAGE_URL/$file"
      done
      echo "Published reviewed immutable model bundle package ${MODEL_PACKAGE_VERSION}."
  artifacts:
    expire_in: 30 days
    paths:
      - dist/model-release/

deploy-staging:
  stage: deploy_staging
  needs:
    - job: build-own-image
      artifacts: true
  resource_group: promiseops-staging
  environment:
    name: promiseops-staging
    deployment_tier: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      set -eu
      TEAM_NAME="${TEAM:-g02}"
      case "$TEAM_NAME" in g0[1-7]) ;; *) echo "Invalid TEAM namespace prefix" >&2; exit 1 ;; esac
      NAMESPACE="${TEAM_NAME}-staging"
      RELEASE_NAME="promiseops"
      DIGEST="$(python - <<'PYDIGEST'
      import json
      import re
      from pathlib import Path

      digest = json.loads(Path("build.json").read_text(encoding="utf-8")).get("containerimage.digest")
      if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
          raise SystemExit("build.json has no valid image digest")
      print(digest)
      PYDIGEST
      )"
      RUNTIME_SA="${PROMISEOPS_RUNTIME_SERVICE_ACCOUNT:-promiseops-api}"
      case "$RUNTIME_SA" in *[!A-Za-z0-9._-]*|'') echo "Invalid runtime service account name" >&2; exit 1 ;; esac
      # Runtime ServiceAccount is staff-managed; CI has no get permission.
      # Keep the configured name; Kubernetes validates it when creating Pods.
      kubectl get secret registry-pull runtime-config -n "$NAMESPACE" -o name >/dev/null

      helm upgrade --install "$RELEASE_NAME" deploy/chart \
        --namespace "$NAMESPACE" \
        --values deploy/chart/values.staging.yaml \
        --set-string "image.repository=${CI_REGISTRY_IMAGE}/app" \
        --set-string "image.digest=${DIGEST}" \
        --set-string "serviceAccount.name=${RUNTIME_SA}" \
        --atomic --wait --timeout 8m --history-max 20

      kubectl rollout status "deployment/${RELEASE_NAME}" -n "$NAMESPACE" --timeout=8m
      mkdir -p deployment-evidence
      {
        echo "environment=staging"
        echo "namespace=${NAMESPACE}"
        echo "commit=${CI_COMMIT_SHA}"
        echo "image=${CI_REGISTRY_IMAGE}/app@${DIGEST}"
      } > deployment-evidence/staging.txt
  artifacts:
    expire_in: 30 days
    paths:
      - deployment-evidence/staging.txt

verify-staging-api:
  stage: deploy_staging
  needs:
    - job: deploy-staging
      artifacts: false
  resource_group: promiseops-staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      set -eu
      TEAM_NAME="${TEAM:-g02}"
      NAMESPACE="${TEAM_NAME}-staging"
      PROMISEOPS_SMOKE_EVIDENCE_FILE="deployment-evidence/staging-smoke.json" \
        sh ci/run_api_smoke.sh "$NAMESPACE"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - deployment-evidence/staging-smoke.json

deploy-production:
  stage: deploy_prod
  needs:
    - job: build-own-image
      artifacts: true
    - job: verify-staging-api
      artifacts: true
  resource_group: promiseops-production
  environment:
    name: promiseops-production
    deployment_tier: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RUN_MODEL_RELEASE != "true"'
      when: manual
  allow_failure: true
  script:
    - |
      set -eu
      TEAM_NAME="${TEAM:-g02}"
      NAMESPACE="${TEAM_NAME}-prod"
      DIGEST="$(python - <<'PYDIGEST'
      import json
      import re
      from pathlib import Path

      digest = json.loads(Path("build.json").read_text(encoding="utf-8")).get("containerimage.digest")
      if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
          raise SystemExit("build.json has no valid image digest")
      print(digest)
      PYDIGEST
      )"
      mkdir -p deployment-evidence
      if kubectl get deployment promiseops -n "$NAMESPACE" >/dev/null 2>&1; then
        PROMISEOPS_SMOKE_RUN_ID="before-${CI_JOB_ID}" \
        PROMISEOPS_SMOKE_EVIDENCE_FILE="deployment-evidence/production-before.json" \
          sh ci/run_api_smoke.sh "$NAMESPACE"
        python - <<'PYMODEL'
      import json
      from pathlib import Path

      staging = json.loads(Path("deployment-evidence/staging-smoke.json").read_text(encoding="utf-8"))
      current = json.loads(Path("deployment-evidence/production-before.json").read_text(encoding="utf-8"))
      if staging.get("model_version") != current.get("model_version"):
          raise SystemExit(
              "Refusing code-only production deploy: staging and current production model versions differ. "
              "Use the reviewed model promotion path or update PROMISEOPS_RELEASE_PACKAGE_VERSION."
          )
      print(f"Current production model matches staging: {current['model_version']}")
      PYMODEL
      else
        echo "No existing API Deployment; this is the initial production install."
      fi
      sh ci/deploy_production.sh "$NAMESPACE" "$DIGEST"
      {
        echo "environment=production"
        echo "namespace=${NAMESPACE}"
        echo "commit=${CI_COMMIT_SHA}"
        echo "image=${CI_REGISTRY_IMAGE}/app@${DIGEST}"
      } > deployment-evidence/production.txt
      PROMISEOPS_SMOKE_RUN_ID="after-${CI_JOB_ID}" \
      PROMISEOPS_SMOKE_EVIDENCE_FILE="deployment-evidence/production-smoke.json" \
        sh ci/run_api_smoke.sh "$NAMESPACE"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - deployment-evidence/production.txt
      - deployment-evidence/production-before.json
      - deployment-evidence/production-smoke.json

rollback-production:
  stage: deploy_prod
  needs: []
  resource_group: promiseops-production
  environment:
    name: promiseops-production
    deployment_tier: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - |
      set -eu
      set +x
      TEAM_NAME="${TEAM:-g02}"
      NAMESPACE="${TEAM_NAME}-prod"
      ROLLBACK_DIGEST_VALUE="${ROLLBACK_DIGEST:-}"
      python - "$ROLLBACK_DIGEST_VALUE" <<'PYROLLBACK'
      import re
      import sys

      if re.fullmatch(r"sha256:[0-9a-f]{64}", sys.argv[1]) is None:
          raise SystemExit("Set ROLLBACK_DIGEST to a previously recorded sha256 digest")
      if sys.argv[1] == "sha256:" + "0" * 64:
          raise SystemExit("The zero digest is not a deployable rollback target")
      PYROLLBACK
      mkdir -p deployment-evidence
      if [ -n "${ROLLBACK_MLFLOW_VERSION:-}" ]; then
        . ci/require_mlflow_ci_env.sh
        sh ci/setup_registry_env.sh
        .registry-venv/bin/python ci/model_registry_lifecycle.py check-approved \
          --version "$ROLLBACK_MLFLOW_VERSION" \
          --evidence deployment-evidence/rollback-registry-preflight.json
      fi
      sh ci/deploy_production.sh "$NAMESPACE" "$ROLLBACK_DIGEST_VALUE"
      mkdir -p deployment-evidence
      {
        echo "environment=production"
        echo "namespace=${NAMESPACE}"
        echo "rollback_image=${CI_REGISTRY_IMAGE}/app@${ROLLBACK_DIGEST_VALUE}"
      } > deployment-evidence/rollback.txt
      PROMISEOPS_SMOKE_EVIDENCE_FILE="deployment-evidence/rollback-smoke.json" \
        sh ci/run_api_smoke.sh "$NAMESPACE"
      if [ -n "${ROLLBACK_MLFLOW_VERSION:-}" ]; then
        .registry-venv/bin/python ci/model_registry_lifecycle.py reconcile \
          --version "$ROLLBACK_MLFLOW_VERSION" \
          --smoke deployment-evidence/rollback-smoke.json \
          --namespace "$NAMESPACE" \
          --expected-image "${CI_REGISTRY_IMAGE}/app@${ROLLBACK_DIGEST_VALUE}" \
          --evidence deployment-evidence/rollback-registry-reconciliation.json
      else
        echo 'NOTE: Emergency rollback completed. No MLflow alias was moved because ROLLBACK_MLFLOW_VERSION was not provided.'
        echo 'If the model changed, run reconcile-champion-production after verifying the registered version.'
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - deployment-evidence/rollback.txt
      - deployment-evidence/rollback-smoke.json
      - deployment-evidence/rollback-registry-preflight.json
      - deployment-evidence/rollback-registry-reconciliation.json

build-model-image:
  stage: model_image
  needs:
    - job: prepare-model-release
      artifacts: true
  resource_group: image-build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RUN_MODEL_RELEASE == "true"'
  script:
    - |
      set -eu
      test -f dist/model-release/model.joblib
      test -f dist/model-release/release.json
      test -f dist/model-release/feature_contract.json
      test -f dist/model-release/dataset_manifest.json
      set -a
      . dist/model-release/release.env
      set +a
      case "$MODEL_MLFLOW_VERSION" in *[!A-Za-z0-9._-]*|'') echo "Invalid MLflow model version" >&2; exit 1 ;; esac
      cp -a /opt/promiseops/wheelhouse ./wheelhouse
      mkdir -p release
      cp -a dist/model-release release
      mkdir -p "$HOME/.docker"
      python ci/registry_login.py
      buildctl --addr "$BUILDKIT_ADDR" \
        --tlsservername "$BUILDKIT_SERVER_NAME" \
        --tlscacert "$BUILDKIT_CA" --tlscert "$BUILDKIT_CERT" --tlskey "$BUILDKIT_KEY" \
        build --frontend dockerfile.v0 --local context=. --local dockerfile=. \
        --opt build-arg:BASE_IMAGE="$BASE_IMAGE" --opt build-arg:UV_IMAGE="$UV_IMAGE" \
        --output "type=image,name=$CI_REGISTRY_IMAGE/app:$CI_COMMIT_SHA-model-$MODEL_MLFLOW_VERSION,push=true" \
        --metadata-file model-build.json
      python - <<'PYDIGEST'
      import json
      import re
      from pathlib import Path

      digest = json.loads(Path("model-build.json").read_text(encoding="utf-8")).get("containerimage.digest")
      if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
          raise SystemExit("model-build.json has no valid image digest")
      print(f"Reviewed model image digest: {digest}")
      PYDIGEST
  artifacts:
    expire_in: 30 days
    paths:
      - model-build.json
      - dist/model-release/selection.json
      - dist/model-release/release.env

deploy-model-staging:
  stage: deploy_model_staging
  needs:
    - job: build-model-image
      artifacts: true
  resource_group: promiseops-staging
  environment:
    name: promiseops-staging
    deployment_tier: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RUN_MODEL_RELEASE == "true"'
  script:
    - |
      set -eu
      TEAM_NAME="${TEAM:-g02}"
      NAMESPACE="${TEAM_NAME}-staging"
      DIGEST="$(python - <<'PYDIGEST'
      import json
      import re
      from pathlib import Path

      digest = json.loads(Path("model-build.json").read_text(encoding="utf-8")).get("containerimage.digest")
      if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
          raise SystemExit("model-build.json has no valid image digest")
      print(digest)
      PYDIGEST
      )"
      RUNTIME_SA="${PROMISEOPS_RUNTIME_SERVICE_ACCOUNT:-promiseops-api}"
      case "$RUNTIME_SA" in *[!A-Za-z0-9._-]*|'') echo "Invalid runtime service account name" >&2; exit 1 ;; esac
      # Runtime ServiceAccount is staff-managed; CI has no get permission.
      # Keep the configured name; Kubernetes validates it when creating Pods.
      kubectl get secret registry-pull runtime-config -n "$NAMESPACE" -o name >/dev/null
      helm upgrade --install promiseops deploy/chart \
        --namespace "$NAMESPACE" \
        --values deploy/chart/values.staging.yaml \
        --set-string "image.repository=${CI_REGISTRY_IMAGE}/app" \
        --set-string "image.digest=${DIGEST}" \
        --set-string "serviceAccount.name=${RUNTIME_SA}" \
        --atomic --wait --timeout 8m --history-max 20
      kubectl rollout status deployment/promiseops -n "$NAMESPACE" --timeout=8m
      mkdir -p deployment-evidence
      echo "environment=staging namespace=${NAMESPACE} image=${CI_REGISTRY_IMAGE}/app@${DIGEST}" \
        > deployment-evidence/model-staging.txt
      PROMISEOPS_SMOKE_EVIDENCE_FILE="deployment-evidence/model-staging-smoke.json" \
        sh ci/run_api_smoke.sh "$NAMESPACE"
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - deployment-evidence/model-staging.txt
      - deployment-evidence/model-staging-smoke.json

promote-model-production:
  stage: deploy_prod
  needs:
    - job: build-model-image
      artifacts: true
    - job: deploy-model-staging
      artifacts: false
  resource_group: promiseops-production
  environment:
    name: promiseops-production
    deployment_tier: production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RUN_MODEL_RELEASE == "true"'
      when: manual
  allow_failure: true
  script:
    - |
      set -eu
      TEAM_NAME="${TEAM:-g02}"
      NAMESPACE="${TEAM_NAME}-prod"
      DIGEST="$(python - <<'PYDIGEST'
      import json
      import re
      from pathlib import Path

      digest = json.loads(Path("model-build.json").read_text(encoding="utf-8")).get("containerimage.digest")
      if not isinstance(digest, str) or re.fullmatch(r"sha256:[0-9a-f]{64}", digest) is None:
          raise SystemExit("model-build.json has no valid image digest")
      print(digest)
      PYDIGEST
      )"
      set -a
      . dist/model-release/release.env
      set +a
      . ci/require_mlflow_ci_env.sh
      sh ci/setup_registry_env.sh
      mkdir -p deployment-evidence
      .registry-venv/bin/python ci/model_registry_lifecycle.py preflight \
        --selection dist/model-release/selection.json \
        --version "$MODEL_MLFLOW_VERSION" \
        --sha256 "$MODEL_ARTIFACT_SHA256" \
        --evidence deployment-evidence/model-registry-preflight.json
      sh ci/deploy_production.sh "$NAMESPACE" "$DIGEST"
      mkdir -p deployment-evidence
      {
        echo "environment=production namespace=${NAMESPACE}"
        echo "image=${CI_REGISTRY_IMAGE}/app@${DIGEST}"
        echo "model_package=${MODEL_PACKAGE_VERSION}"
        echo "model_version=${MODEL_MLFLOW_VERSION}"
        echo "model_artifact_sha256=${MODEL_ARTIFACT_SHA256}"
      } \
        > deployment-evidence/model-production.txt
      PROMISEOPS_SMOKE_EVIDENCE_FILE="deployment-evidence/model-production-smoke.json" \
        sh ci/run_api_smoke.sh "$NAMESPACE"
      .registry-venv/bin/python ci/model_registry_lifecycle.py promote \
        --selection dist/model-release/selection.json \
        --version "$MODEL_MLFLOW_VERSION" \
        --sha256 "$MODEL_ARTIFACT_SHA256" \
        --smoke deployment-evidence/model-production-smoke.json \
        --namespace "$NAMESPACE" \
        --expected-image "${CI_REGISTRY_IMAGE}/app@${DIGEST}" \
        --evidence deployment-evidence/model-registry-promotion.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - deployment-evidence/model-production.txt
      - deployment-evidence/model-production-smoke.json
      - deployment-evidence/model-registry-preflight.json
      - deployment-evidence/model-registry-promotion.json

# Manual, auditable alias recovery after rollback or an interrupted promotion.
# Cannot approve pending/unreviewed models or change the running image.
reconcile-champion-production:
  stage: inspect
  needs: []
  resource_group: promiseops-production
  environment:
    name: promiseops-production
    action: verify
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  script:
    - |
      set -eu
      set +x
      : "${REGISTRY_MODEL_VERSION:?Provide a previously approved MLflow Model Version}"
      [ "${REGISTRY_RECONCILE_APPROVED:-}" = yes ] || { echo 'Set REGISTRY_RECONCILE_APPROVED=yes' >&2; exit 1; }
      TEAM_NAME="${TEAM:-g02}"
      case "$TEAM_NAME" in g0[1-7]) ;; *) echo 'Invalid team' >&2; exit 1 ;; esac
      NAMESPACE="${TEAM_NAME}-prod"
      mkdir -p deployment-evidence
      . ci/require_mlflow_ci_env.sh
      sh ci/setup_registry_env.sh
      .registry-venv/bin/python ci/model_registry_lifecycle.py check-approved \
        --version "$REGISTRY_MODEL_VERSION" \
        --evidence deployment-evidence/manual-registry-preflight.json
      IMAGE="$(kubectl get deployment promiseops -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[?(@.name=="api")].image}')"
      PROMISEOPS_SMOKE_EVIDENCE_FILE="deployment-evidence/manual-registry-smoke.json" \
        sh ci/run_api_smoke.sh "$NAMESPACE"
      .registry-venv/bin/python ci/model_registry_lifecycle.py reconcile \
        --version "$REGISTRY_MODEL_VERSION" \
        --smoke deployment-evidence/manual-registry-smoke.json \
        --namespace "$NAMESPACE" \
        --expected-image "$IMAGE" \
        --evidence deployment-evidence/manual-registry-reconciliation.json
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - deployment-evidence/manual-registry-preflight.json
      - deployment-evidence/manual-registry-smoke.json
      - deployment-evidence/manual-registry-reconciliation.json
