# Production load testing is deliberately manual; does not run with deployment.
# The first run defaults to a 1 RPS / 10 s connectivity pilot.
load-test-production:
  stage: inspect
  needs: []
  resource_group: promiseops-production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
  allow_failure: true
  variables:
    PROMISEOPS_LOAD_PROFILE: "pilot"
    PROMISEOPS_LOAD_VALIDATION_END: "2018-04-30T23:59:59-03:00"
    PROMISEOPS_LOAD_AS_OF: "2018-06-29T23:59:59-03:00"
    PROMISEOPS_LOAD_ORDER_LIMIT: "200"
  script:
    - set -eu
    - cp -a /opt/promiseops/wheelhouse ./wheelhouse
    - uv venv --python /usr/local/bin/python .load-venv
    - uv pip sync --python .load-venv/bin/python --no-index --find-links wheelhouse --require-hashes requirements.lock
    - sh ci/run_load_test.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/load/
